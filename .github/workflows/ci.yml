name: ci
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ scripts/
      - name: Format check (ruff)
        run: uv run ruff format src/ tests/ scripts/ --check
      - name: Tests
        run: uv run pytest tests/ -q --ignore=tests/test_integration.py
      - name: Install webapp deps
        working-directory: web_sota
        run: bun install --frozen-lockfile
      - name: Typecheck + build webapp
        working-directory: web_sota
        run: bun run build
      - name: Lint webapp (biome)
        working-directory: web_sota
        run: bun run biome:ci
      - name: Install Playwright browsers
        working-directory: web_sota
        run: bunx playwright install chromium
      - name: E2E smoke (backend + frontend via webServer)
        working-directory: web_sota
        run: bun run e2e
